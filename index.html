<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Crop Recommendation System</title>
    
    <!-- Google Fonts & Font Awesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Custom Modern CSS -->
    <link rel="stylesheet" href="/style.css">
  </head>

  <body>
    <!-- Animated Glowing Background Elements -->
    <div class="bg-glow blob-1"></div>
    <div class="bg-glow blob-2"></div>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg glass-nav sticky-top">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" href="#">
          <div class="brand-icon"><i class="fa-solid fa-wheat-awn"></i></div>
          <span>AgriPredict<span class="text-accent">.ai</span></span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#">Dashboard</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Analytics</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Model Specs</a>
            </li>
          </ul>
          <form class="d-flex search-box" role="search">
            <input class="form-control me-2 glass-input" type="search" placeholder="Search parameters..." aria-label="Search"/>
            <button class="btn btn-glow" type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
          </form>
        </div>
      </div>
    </nav>

    <!-- Main Container -->
    <main class="container my-5">
      <div class="glass-card main-wrapper p-4 p-md-5">
        
        <!-- Header Section -->
        <div class="header-section text-center mb-5">
          <div class="badge-pill mb-3"><i class="fa-solid fa-microchip me-1"></i> Machine Learning Engine</div>
          <h1 class="main-title">Crop Recommendation System</h1>
          <p class="subtitle">Input your soil and environmental metrics to get real-time AI agricultural insights.</p>
        </div>

        {% if result %}
        <section class="recommendation-result" aria-live="polite">
          <img src="/img.jpg" alt="Recommended crop">
          <div>
            <h2>Recommended Crop</h2>
            <p>{{ result }}</p>
          </div>
        </section>
        {% endif %}

        <!-- Form Section -->
        <form action="/predict" method="POST" class="needs-validation">
          <div class="row g-4">
            
            <!-- Nitrogen -->
            <div class="col-md-4">
              <div class="input-group-custom">
                <label for="Nitrogen" class="form-label"><i class="fa-solid fa-flask text-success me-2"></i>Nitrogen (N)</label>
                <input type="number" step="any" class="form-control glass-input" id="Nitrogen" name="Nitrogen" required placeholder="e.g. 90">
              </div>
            </div>

            <!-- Phosphorus -->
            <div class="col-md-4">
              <div class="input-group-custom">
                <label for="Phosphorus" class="form-label"><i class="fa-solid fa-vial text-warning me-2"></i>Phosphorus (P)</label>
                <input type="number" step="any" class="form-control glass-input" id="Phosphorus" name="Phosphorus" required placeholder="e.g. 42">
              </div>
            </div>

            <!-- Potassium -->
            <div class="col-md-4">
              <div class="input-group-custom">
                <label for="Potassium" class="form-label"><i class="fa-solid fa-atom text-info me-2"></i>Potassium (K)</label>
                <input type="number" step="any" class="form-control glass-input" id="Potassium" name="Potassium" required placeholder="e.g. 43">
              </div>
            </div>

            <!-- Temperature -->
            <div class="col-md-4">
              <div class="input-group-custom">
                <label for="Temperature" class="form-label"><i class="fa-solid fa-temperature-half text-danger me-2"></i>Temperature (°C)</label>
                <input type="number" step="0.01" class="form-control glass-input" id="Temperature" name="Temperature" required placeholder="e.g. 20.87">
              </div>
            </div>

            <!-- Humidity -->
            <div class="col-md-4">
              <div class="input-group-custom">
                <label for="Humidity" class="form-label"><i class="fa-solid fa-droplet text-primary me-2"></i>Humidity (%)</label>
                <input type="number" step="0.01" class="form-control glass-input" id="Humidity" name="Humidity" required placeholder="e.g. 82.00">
              </div>
            </div>

            <!-- pH Level -->
            <div class="col-md-4">
              <div class="input-group-custom">
                <label for="ph" class="form-label"><i class="fa-solid fa-gauge-high text-warning me-2"></i>ph</label>
                <input type="number" step="0.01" class="form-control glass-input" id="ph" name="ph" required placeholder="e.g. 6.50">
              </div>
            </div>

            <!-- Rainfall -->
            <div class="col-md-12">
              <div class="input-group-custom">
                <label for="Rainfall" class="form-label"><i class="fa-solid fa-cloud-showers-heavy text-primary me-2"></i>Rainfall (mm)</label>
                <input type="number" step="0.01" class="form-control glass-input" id="Rainfall" name="Rainfall" required placeholder="e.g. 202.93">
              </div>
            </div>

            <!-- Submit Button -->
            <div class="col-12 text-center mt-5">
              <button type="submit" class="btn btn-gradient btn-lg">
                <span>Analyze & Recommend</span>
                <i class="fa-solid fa-wand-magic-sparkles ms-2"></i>
              </button>
            </div>

          </div>
        </form>
      </div>
    </main>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
